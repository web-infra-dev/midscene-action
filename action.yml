name: Midscene Action
description: Run Midscene tests in GitHub Actions and publish native reports to Cloudflare Workers.
branding:
  icon: activity
  color: white
inputs:
  working-directory:
    description: Caller-specified Midscene test project directory, used to run the command and collect reports.
    required: true
  command:
    description: Command to run the installed Midscene test suite.
    default: npx midscene-test
  artifact-name:
    description: Report artifact name; use unique names in a matrix.
    default: midscene-results
  retention-days:
    description: Raw report retention in days.
    default: '14'
  publish-pages:
    description: Set true to deploy the native report to Cloudflare after testing.
    default: 'false'
  cloudflare-api-token:
    description: Cloudflare API token. Workers Admin is needed to create a Worker; Editor can target an existing Worker. Required when publishing.
  cloudflare-account-id:
    description: Cloudflare account ID. Required when publishing.
  cloudflare-worker-name:
    description: Cloudflare Worker name. Created on first publication.
    default: midscene-reports
outputs:
  report-artifact-name:
    description: Uploaded report name, or empty when no files were uploaded.
    value: ${{ steps.upload-results.outputs.artifact-id != '' && inputs.artifact-name || '' }}
  artifact-url:
    description: Uploaded artifact URL.
    value: ${{ steps.upload-results.outputs.artifact-url }}
  test-result:
    description: Test command step outcome.
    value: ${{ steps.test.outcome }}
  page-url:
    description: URL of this run's Cloudflare report, or empty when deployment did not succeed.
    value: ${{ steps.deployment.outputs.preview-deployment-url }}
  publication-result:
    description: Deployment step outcome (success, failure, skipped, or cancelled).
    value: ${{ steps.deployment.outcome }}
runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        TEST_DIRECTORY: ${{ inputs.working-directory }}
        TEST_COMMAND: ${{ inputs.command }}
        PUBLISH_PAGES: ${{ inputs.publish-pages }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_WORKER_NAME: ${{ inputs.cloudflare-worker-name }}
      run: |
        if [[ -z "$TEST_DIRECTORY" ]]; then
          echo 'working-directory is required' >&2
          exit 1
        fi
        if [[ "$PUBLISH_PAGES" != true && "$PUBLISH_PAGES" != false ]]; then
          echo 'publish-pages must be true or false' >&2
          exit 1
        fi
        if [[ "$PUBLISH_PAGES" == true && ( -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_WORKER_NAME" ) ]]; then
          echo '::error::Set cloudflare-api-token, cloudflare-account-id, and cloudflare-worker-name to publish reports.'
          exit 1
        fi

    - name: Resolve Midscene artifact directories
      id: artifacts
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/src/artifacts.mjs" paths

    - name: Run all Midscene cases
      id: test
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_COMMAND: ${{ inputs.command }}
        MIDSCENE_RUN_DIR: ${{ steps.artifacts.outputs.run-directory }}
      run: bash -e -o pipefail -c "$TEST_COMMAND"

    - name: Upload Midscene test report
      id: upload-results
      if: ${{ always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.artifacts.outputs.artifact-paths }}
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Write test results to Summary
      if: ${{ always() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MIDSCENE_ARTIFACT_ROOTS: ${{ steps.artifacts.outputs.artifact-roots }}
      run: |
        node "$GITHUB_ACTION_PATH/src/artifacts.mjs" summary

    - name: Prepare Cloudflare report
      id: report
      if: ${{ !cancelled() && inputs.publish-pages == 'true' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLOUDFLARE_WORKER_NAME: ${{ inputs.cloudflare-worker-name }}
        MIDSCENE_ARTIFACT_ROOTS: ${{ steps.artifacts.outputs.artifact-roots }}
      run: node "$GITHUB_ACTION_PATH/src/cloudflare-report.mjs"

    - name: Deploy report to Cloudflare Workers
      id: deployment
      if: ${{ !cancelled() && steps.report.outcome == 'success' }}
      uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        wranglerVersion: '4.136.3'
        packageManager: npm
        workingDirectory: ${{ steps.report.outputs.directory }}
        command: preview --name run-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Verify published report URL and write Summary
      if: ${{ steps.deployment.outcome == 'success' }}
      shell: bash
      env:
        PAGE_URL: ${{ steps.deployment.outputs.preview-deployment-url }}
      run: |
        if [[ -z "$PAGE_URL" ]]; then
          echo '::error::Cloudflare uploaded the report but returned no deployment URL. Open Workers & Pages > your Worker > Domains > Worker URL and enable Preview, then rerun the workflow.'
          exit 1
        fi
        if [[ "$PAGE_URL" != https://* ]]; then
          echo '::error::Cloudflare returned a non-HTTPS report URL.'
          exit 1
        fi
        curl --fail --silent --show-error --retry 3 --max-time 30 "$PAGE_URL" -o "$RUNNER_TEMP/midscene-published-report.html"
        grep -q 'midscene_test_run_dump' "$RUNNER_TEMP/midscene-published-report.html"
        echo "[Open the Midscene Test report ↗]($PAGE_URL)" >> "$GITHUB_STEP_SUMMARY"

    - name: Preserve command failure
      if: ${{ !cancelled() && steps.test.outcome == 'failure' }}
      shell: bash
      run: exit 1
